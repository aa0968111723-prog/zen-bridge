name: Build matching Windows Vulkan ASR runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      WHISPER_REVISION: 2eeeba56e9edd762b4b38467bab96c2517163158
      VULKAN_VERSION: 1.4.321.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: 2eeeba56e9edd762b4b38467bab96c2517163158
          path: native-source
      - name: Install byte-pinned build SDK
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk.exe'
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkan_sdk.exe" -OutFile $installer
          if ((Get-FileHash $installer).Hash.ToLower() -ne 'baaa4f7ca11ed3d82aa1c102b21208915485bbaa473068c763daa425cca468bd') { throw 'Vulkan SDK checksum mismatch' }
          $directory = Join-Path $env:RUNNER_TEMP 'VulkanSDK'
          $process = Start-Process $installer -WindowStyle Hidden -Wait -PassThru -ArgumentList @('--root', $directory, '--accept-licenses', '--default-answer', '--confirm-command', 'install')
          if ($process.ExitCode) { throw 'Vulkan SDK install failed' }
          "VULKAN_SDK=$directory" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build server and all backends from the same source
        shell: pwsh
        run: |
          cmake -S native-source -B native-build -A x64 -DGGML_VULKAN=ON -DGGML_BACKEND_DL=ON -DBUILD_SHARED_LIBS=ON -DWHISPER_BUILD_SERVER=ON -DWHISPER_BUILD_TESTS=OFF -DGGML_NATIVE=OFF
          if ($LASTEXITCODE) { throw 'Native configure failed' }
          cmake --build native-build --config Release --parallel 4
          if ($LASTEXITCODE) { throw 'Native build failed' }
          $destination = Join-Path $env:GITHUB_WORKSPACE 'dist/whisper-vulkan'
          New-Item -ItemType Directory -Force $destination | Out-Null
          Copy-Item native-build/bin/Release/whisper-server.exe $destination
          Copy-Item native-build/bin/Release/*.dll $destination
          if (!(Test-Path "$destination/ggml-vulkan.dll")) { throw 'Vulkan backend missing' }
          Copy-Item native-source/LICENSE "$destination/LICENSE-whisper.txt"
          Copy-Item native-source/ggml/LICENSE "$destination/LICENSE-ggml.txt"
          Push-Location $destination
          try {
            & ./whisper-server.exe --help
            if ($LASTEXITCODE -notin @(0, 1)) { throw 'Native server smoke failed' }
          } finally { Pop-Location }
          $files = @{}
          Get-ChildItem $destination -File | ForEach-Object {
            $files[$_.Name] = @{size=$_.Length;sha256=(Get-FileHash $_.FullName).Hash.ToLower()}
          }
          @{source=$env:WHISPER_REVISION;sdk=$env:VULKAN_VERSION;files=$files} | ConvertTo-Json -Depth 6 | Set-Content "$destination/build-manifest.json" -Encoding utf8
          Compress-Archive "$destination/*" 'dist/whisper-vulkan-windows-x64.zip'
          (Get-FileHash 'dist/whisper-vulkan-windows-x64.zip').Hash.ToLower() | Set-Content 'dist/whisper-vulkan-windows-x64.zip.sha256' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: matching-whisper-vulkan-windows-x64
          path: dist/whisper-vulkan-windows-x64.zip*
