name: Windows local translation backend
on:
  pull_request:
    paths:
      - 'sidecar/live-room/**'
      - '.github/workflows/local-backend.yml'
      - '.github/workflows/live-room-windows-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        working-directory: sidecar/live-room
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt -r requirements-dev.txt
      # Full regression (including the unchanged SQLite p95 gate) belongs to
      # live-room-windows-tests.yml on both Python versions. This job adds
      # focused desktop coverage and the native/PowerShell gates below.
      - name: Windows desktop, translation and admin gates
        run: >-
          python -m pytest -q
          tests/test_local_translate.py tests/test_desktop_llm.py
          tests/test_admin_api.py tests/test_admin_security_regression.py
          tests/test_agent_requests.py tests/test_agent_suite.py
          tests/test_native_worker_protocol.py tests/test_native_fallback.py
          tests/test_asr_gpu.py tests/test_update_runtime.py
          tests/test_desktop_update.py tests/test_draft_model_package.py
          tests/test_fast_final.py
      - name: Privacy capture and audience controls
        run: |
          node tests/recorder_machine.test.mjs
          node tests/room_client.test.mjs
          node tests/recorder_private_pause.test.mjs
          node tests/audience_private_pause.test.mjs
      - name: Validate PowerShell 5.1 parsing
        shell: powershell
        run: |
          foreach ($file in @('scripts/setup_local.ps1','scripts/start_backend.ps1','scripts/bench_local.ps1','scripts/bench/collect_env.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) $file),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw "PowerShell parse failed: $file" }
          }
      - name: Fetch byte-pinned native runtime and VAD
        run: |
          python scripts/fetch_windows_runtime.py
          python scripts/fetch_silero_vad.py
      - name: Real native ONNX smoke
        run: python -c "from app.vad import SileroVad; import numpy as np; assert SileroVad().analyze_pcm(np.zeros(16000,dtype=np.float32)).speech_ratio == 0"
