name: Zen Bridge integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: node tests/runtime.mjs
      - run: node tests/capture.mjs
      - run: node tests/recording-archive.mjs
      - run: node tests/capture-endpoint.mjs
      - run: node tests/preview-client.mjs
      - run: node tests/connection-watch.mjs
      - run: node tests/breeze-gateway.mjs
      - run: node tests/zen-front.mjs
      - run: node tests/tencent-build.mjs
      - run: node tests/dictionary-bootstrap.mjs
      - run: node tests/application-readiness.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/deploy_rollback.py
      - run: python tests/deploy_artifacts.py
      - run: python -m unittest discover -s tests -p dictionary_dataset.py
      - name: Test desktop runtime
        working-directory: sidecar/live-room
        run: |
          python -m pip install -r requirements-lock.txt -r requirements-dev.txt
          python -m pytest
          node tests/recorder_machine.test.mjs
          node tests/room_client.test.mjs
          node tests/recorder_private_pause.test.mjs
          node tests/audience_private_pause.test.mjs
      - run: pnpm build
        env:
          DEPLOY_TARGET: local
      - run: node tests/startup.mjs
      - run: tar -czf zen-local-ui.tgz dist public drizzle scripts lib sidecar/breeze-gateway.mjs sidecar/zen-front.mjs dictionary-data package.json pnpm-lock.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: zen-local-ui
          path: zen-local-ui.tgz
